[project]
name = "nba2k-rpg"
version = "0.1.0"
description = "A self-directed RPG progression layer for NBA 2K26 MyNBA player-locked careers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jordan Koch" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
# The one canonical way to run the served build (ADR-free decision 9 in the
# 1.1 scope). Matches the `uv run <tool>` idiom the rest of the toolchain uses.
# This name is load-bearing: ops/README.md, README.md's Setup block, and the
# CI smoke step all spell it out, and it appears in the web app's
# backend-unreachable panel. Renaming it means renaming it in all of them.
rpg-serve = "rpg_api.serve:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # TestClient raises at import without an httpx. Starlette 1.6 deprecates
    # the original in favour of httpx2 and warns on every run with it.
    "httpx2>=2.10",
    # tests/test_ci_contexts.py parses the workflow; mypy strict needs the stubs.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Makes uvicorn --reload fast in dev mode; see ops/README.md.
    "watchfiles>=0.24",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both packages, deliberately. Omitting rpg_api passes every local test —
# pythonpath = ["src"] puts it on the path regardless — and then fails with
# ModuleNotFoundError on an installed environment. tests/test_packaging.py
# is the structural guard for exactly that.
packages = ["src/rpg_core", "src/rpg_api"]

# ─── Lint & format ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes — every event timestamp is tz-aware or it is a bug
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",     # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ─── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# ─── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ on the path so a bare `python -m pytest` works without an editable
# install. `uv run pytest` installs the project anyway; this is for the machine
# that doesn't have uv yet (see ops/README.md).
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: hits a live external source. Excluded from CI; run explicitly with -m network.",
]
