[project]
name = "nba2k-rpg"
version = "0.1.0"
description = "A self-directed RPG progression layer for NBA 2K26 MyNBA player-locked careers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jordan Koch" }]
dependencies = []

# Runtime dependencies stay empty until a phase needs one. FastAPI arrives with
# Phase 1 item 1.1 (app-shell); the modeling stack arrives with Phase 2.
# See ROADMAP.md — nothing is installed speculatively.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=2.3.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_core"]

# ─── Lint & format ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes — every event timestamp is tz-aware or it is a bug
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",     # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ─── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# ─── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ on the path so a bare `python -m pytest` works without an editable
# install. `uv run pytest` installs the project anyway; this is for the machine
# that doesn't have uv yet (see ops/README.md).
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: hits a live external source. Excluded from CI; run explicitly with -m network.",
]
