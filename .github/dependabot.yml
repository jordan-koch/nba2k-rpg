version: 2

# Keeps actions and dependencies current without anyone remembering to check.
# The failure mode this exists to prevent: an action pinned to a deprecated
# runtime that warns for months and then breaks CI on a day nobody expected.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    # Patch bumps for a solo project are noise — the lockfile is committed and
    # CI rebuilds from it, so a broken patch release surfaces on the next real
    # PR anyway.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    # typescript-eslint pins an UPPER bound on typescript (">=4.8.4 <6.1.0" as
    # of 8.67.0), so bumping typescript alone produces a PR that cannot install:
    # `npm ci` fails ERESOLVE before any check runs. That happened with TS 7.0.2
    # in PR #13, and the group below was added to stop it happening again.
    #
    # The group was not enough. PR #17 raised the identical unmergeable bump two
    # minutes after the group landed: when a group's other members have no newer
    # version available, dependabot still opens the group with the one member
    # that does. Grouping synchronises packages that move together — it cannot
    # hold one back until its peers catch up. So the major is ignored outright
    # below, and the group keeps its real job of moving the whole toolchain in a
    # single PR once there is a whole toolchain to move.
    groups:
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
    # Same posture as the uv entry above, and the same reasoning: the lockfile
    # is committed and CI rebuilds from it with `npm ci`, so a broken patch
    # release surfaces on the next real PR anyway.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # Measured 2026-08-21: typescript-eslint's latest stable is still 8.67.0
      # with the <6.1.0 peer bound, and only 8.67.1-alpha.* exists beyond it —
      # so no TypeScript 7 bump can install. DELETE THIS ENTRY once a stable
      # typescript-eslint accepts TS 7; the group above then handles the move.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
