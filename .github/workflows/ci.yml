name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch — a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # TODO: switch to `uv sync --locked` once uv.lock is generated and
        # committed (`uv lock` locally). Until then there is no lockfile to
        # honour and --locked would fail the build. See ops/README.md.
        run: uv sync

      - name: Ruff — lint
        run: uv run ruff check --output-format=github

      - name: Ruff — format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        # -m "not network" keeps live external pulls out of CI.
        run: uv run pytest -m "not network" --cov=rpg_core --cov-report=term-missing

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history — a secret removed from HEAD is still a leaked secret.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
